spring.datasource.url=jdbc:h2:mem:sgt_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=PUBLIC
sgt.jwt.secret=sgt-test-secret-key-with-at-least-32-characters
sgt.jwt.expiration-hours=8
sgt.cors.allowed-origins=http://localhost:5173
spring.mail.host=localhost
spring.mail.port=2525
sgt.mail.enabled=false
sgt.frontend.url=http://localhost:5173
