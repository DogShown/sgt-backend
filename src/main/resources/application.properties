# URL de conexão com o SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sgt_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${SGT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialeto do Hibernate para SQL Server
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
# Defina SGT_JWT_SECRET no ambiente local. Use uma chave longa e aleatória.
sgt.jwt.secret=${SGT_JWT_SECRET}
sgt.jwt.expiration-hours=${SGT_JWT_EXPIRATION_HOURS:8}
