# URL de conexão com o SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sgt_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${SGT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialeto do Hibernate para SQL Server
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
# Em produção, defina SGT_JWT_SECRET no ambiente.
# O valor abaixo existe apenas como fallback para desenvolvimento local.
sgt.jwt.secret=${SGT_JWT_SECRET:SGT-local-development-secret-2026-09-29-32chars}
sgt.jwt.expiration-hours=${SGT_JWT_EXPIRATION_HOURS:8}
