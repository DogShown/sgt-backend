# URL de conexão com o SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sgt_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${SGT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dialeto explícito do Hibernate para SQL Server.
# Evita depender da leitura de metadados quando a conexão estiver indisponível.
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.show-sql=true

# Origens autorizadas para chamadas diretas ao Backend (separadas por virgula).
# Para Vite com proxy /api, o navegador usa a mesma origem do Frontend.
sgt.cors.allowed-origins=${SGT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
# O schema de runtime do Backend esta documentado em database/01_sgt_runtime_schema.sql.

# JWT
# Em produção, defina SGT_JWT_SECRET no ambiente.
# O valor abaixo existe apenas como fallback para desenvolvimento local.
sgt.jwt.secret=${SGT_JWT_SECRET:SGT-local-development-secret-2026-09-29-32chars}
sgt.jwt.expiration-hours=${SGT_JWT_EXPIRATION_HOURS:8}

# Web Push / VAPID
# Gere um par de chaves uma única vez e forneça via ambiente.
sgt.push.public-key=${SGT_VAPID_PUBLIC_KEY:}
sgt.push.private-key=${SGT_VAPID_PRIVATE_KEY:}
sgt.push.subject=${SGT_VAPID_SUBJECT:mailto:admin@sgt.local}
