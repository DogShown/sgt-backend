# Credenciais do SQL Server devem ser fornecidas no ambiente; nunca versionar segredos.
spring.datasource.url=jdbc:sqlserver://sgt_db_sql.mssql.somee.com;databaseName=sgt_db_sql;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${SGT_DB_USERNAME}
spring.datasource.password=${SGT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.show-sql=false
sgt.cors.allowed-origins=${SGT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
sgt.jwt.secret=${SGT_JWT_SECRET:SGT-local-development-secret-2026-09-29-32chars}
sgt.jwt.expiration-hours=${SGT_JWT_EXPIRATION_HOURS:8}

# SMTP obrigatório para recuperação de senha e confirmação de e-mail.
spring.mail.host=${SGT_MAIL_HOST:localhost}
spring.mail.port=${SGT_MAIL_PORT:587}
spring.mail.username=${SGT_MAIL_USERNAME:}
spring.mail.password=${SGT_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SGT_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SGT_MAIL_STARTTLS:true}
sgt.mail.from=${SGT_MAIL_FROM:noreply@sgt.local}
sgt.frontend.url=${SGT_FRONTEND_URL:http://localhost:5173}
sgt.push.public-key=${SGT_VAPID_PUBLIC_KEY:}
sgt.push.private-key=${SGT_VAPID_PRIVATE_KEY:}
sgt.push.subject=${SGT_VAPID_SUBJECT:mailto:admin@sgt.local}
