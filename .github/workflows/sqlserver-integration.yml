name: SQL Server integration smoke test

on:
  workflow_dispatch:

jobs:
  sqlserver-smoke:
    runs-on: ubuntu-latest
    env:
      SGT_DB_USERNAME: ${{ secrets.SGT_DB_USERNAME }}
      SGT_DB_PASSWORD: ${{ secrets.SGT_DB_PASSWORD }}
      SGT_JWT_SECRET: sgt-integration-test-secret-with-32-chars-minimum
      SGT_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SGT_MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sgt-core-completion
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check required SQL Server secrets
        run: |
          test -n "$SGT_DB_USERNAME" || (echo "Missing repository secret SGT_DB_USERNAME" && exit 1)
          test -n "$SGT_DB_PASSWORD" || (echo "Missing repository secret SGT_DB_PASSWORD" && exit 1)
      - name: Verify SQL Server connection
        run: bash mvnw -B -Dtest=SqlServerConnectionIT test
